[project]
name = "malt-fxtr"
version = "0.1.0"
description = "METR MALT agent transcripts in fxtr: auditing runs for cheating"
requires-python = ">=3.12.4"
dependencies = [
    "behaviors[models]==0.0.1a6",
    "fxtr[debug-web,runner]==0.2.0a1",
    "duckdb>=1.1",
    "jsonschema>=4.26.0",
]

[tool.uv]
# Installed (editably) into its own venv, so the `fxtr` command, which has no project directory on
# its path, can import the modules [tool.fxtr] lists.
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/malt_fxtr"]

[tool.fxtr]
# The modules whose import registers the project's steps and workflows: what a process with no
# script of its own (a resume, the CLI, the viewer) imports.
modules = ["malt_fxtr.runs", "malt_fxtr.audit"]

[tool.fxtr.views]
# The project's renderer package (views/): `fxtr views build` builds it into views/dist, which the
# viewer serves.
package = "views"
